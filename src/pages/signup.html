---
layout: minimal
title: Signup
---

<!-- Wrapper -->
<div class="auth-wrapper columns is-gapless">
  <!-- Form section -->
  <div class="column is-5">
    <div class="hero is-fullheight is-white">
      <div class="hero-heading">
        <div class="auth-logo">
          <a href="/">
            <img class="top-logo" src="img/logo/logo.svg" alt="" />
          </a>
        </div>
      </div>
      <div class="hero-body">
        <div class="container">
          <div class="columns">
            <div class="column is-12">
              <div class="auth-content">
                <h2>Join Us Now.</h2>
                <p>Start by creating your account</p>
                <a href="/login.html">I already have an account </a>
              </div>
              <div class="auth-form-wrapper">
                <!-- Login Form -->
                <form>
                  <div id="signin-form" class="login-form">
                    <!-- Input -->
                    <div class="field">
                      <div class="control has-icon">
                        <input
                          class="input"
                          type="text"
                          placeholder="Username"
                        />
                        <span class="form-icon">
                          <i data-feather="user"></i>
                        </span>
                      </div>
                    </div>
                    <!-- Input -->
                    <div class="field">
                      <div class="control has-icon">
                        <input
                          class="input"
                          type="text"
                          placeholder="Email Address"
                        />
                        <span class="form-icon">
                          <i data-feather="mail"></i>
                        </span>
                      </div>
                    </div>
                    <!-- Input -->
                    <div class="field">
                      <div class="control has-icon">
                        <input
                          class="input"
                          type="password"
                          placeholder="Password"
                        />
                        <span class="form-icon">
                          <i data-feather="lock"></i>
                        </span>
                      </div>
                    </div>
                    <!-- Input -->
                    <div class="field">
                      <div class="control has-icon">
                        <input
                          class="input"
                          type="password"
                          placeholder="Repeat Password"
                        />
                        <span class="form-icon">
                          <i data-feather="lock"></i>
                        </span>
                      </div>
                    </div>

                    <div class="setting-item">
                      <label class="form-switch is-primary">
                        <input type="checkbox" class="is-switch" />
                        <i></i>
                      </label>
                      <div class="setting-meta">
                        <span>Receive promotional offers</span>
                      </div>
                    </div>

                    <!-- Submit -->
                    <div class="control login">
                      <button
                        class="
                          button
                          h-button
                          is-primary is-bold is-fullwidth is-raised
                        "
                      >
                        Sign Up
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Image section (hidden on mobile) -->
  <div
    class="
      column
      login-column
      is-7 is-hidden-mobile
      h-hidden-tablet-p
      hero-banner
    "
  >
    <div class="hero login-hero is-fullheight is-app-grey">
      <div class="hero-body">
        <div class="container">
          <div class="columns signup-image-wrap">
            <div class="column is-12">
              <img
                src="https://dummyimage.com/963x1000"
                data-demo-src="img/photo/bg/tourist.png"
                alt=""
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
