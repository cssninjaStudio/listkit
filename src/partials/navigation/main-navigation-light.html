<div class="main-navigation-light" x-data="initNavbarLight()"  x-on:scroll.window="scroll()" x-on:mouseleave="megamenuOpened = false"
    :class="{
        'is-scrolled': scrolled,
        '': !scrolled,
        'is-solid': megamenuOpened,
        '': !megamenuOpened,
    }">
    <div class="main-navigation--menu">

        <div class="container">
            <div class="main-navigation--menu-inner">
                <div class="left">
                    <a href="/" class="brand">
                        <img class="light-logo" src="/img/logo/logo-w.svg" alt="">
                        <img class="dark-logo" src="/img/logo/logo.svg" alt="">
                    </a>
                </div>
        
                <div class="center">
                    <div class="navigation-link has-caret" x-on:mouseover="megamenuOpened = true, openedMegamenu = 'megamenu-1'">
                        <a class="is-flex is-align-items-center">
                            <span>Events</span>
                            <i data-feather="chevron-down"></i>
                        </a>
                    </div>
                    <div class="navigation-link has-caret" x-on:mouseover="megamenuOpened = true, openedMegamenu = 'megamenu-2'">
                        <a class="is-flex is-align-items-center">
                            <span>Trips</span>
                            <i data-feather="chevron-down"></i>
                        </a>
                    </div>
                    <div class="navigation-link has-caret" x-on:mouseover="megamenuOpened = true, openedMegamenu = 'megamenu-3'">
                        <a class="is-flex is-align-items-center">
                            <span>Flats</span>
                            <i data-feather="chevron-down"></i>
                        </a>
                    </div>
                </div>
        
                <div class="right">
                    <div class="navigation-link is-host">
                        <a>Host Event</a>
                    </div>
                    <button class="navigation-link is-icon mx-4 modal-trigger" data-modal="languages-modal">
                        <i data-feather="globe"></i>
                    </button>
                    <div class="account-drop">
                        <button @click="openDrop('account-drop')" @click.away="closeDrop('account-drop')">
                            <span class="image is-32x32">
                                <img class="is-rounded" src="https://dummyimage.com/150x150" data-demo-src="/img/photo/avatar/placeholder.png" alt="">
                            </span>
                        </button>
                        <div x-show.transition="accountDropOpened" class="drop-menu">
                            <div class="drop-menu-inner">
                                <a class="drop-menu-item is-heavy">Sign In</a>
                                <a class="drop-menu-item">Register</a>
                                <hr>
                                <a class="drop-menu-item">Host Event</a>
                                <a class="drop-menu-item">Explore Events</a>
                                <a class="drop-menu-item">Help</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    {{> megamenu}}

</div>
