networks:
  cssninja-services:
    external: true

services:
  listkit-demo:
    image: digisquad/cssninja.listkit-demo:latest
    networks:
      - cssninja-services
    restart: "${DEMO_RESTART:-unless-stopped}"
    labels:
      traefik.enable: true
      traefik.docker.network: "cssninja-services"
      traefik.http.routers.listkit-demo.entrypoints: "http"
      traefik.http.routers.listkit-demo.rule: "Host(`listkit.${HOST:-127.0.0.1.nip.io}`)"
      traefik.http.routers.listkit-demo.middlewares: "https-redirect@file"
      traefik.http.services.listkit-demo-https.loadbalancer.server.port: 8080
      traefik.http.routers.listkit-demo-https.rule: "Host(`listkit.${HOST:-127.0.0.1.nip.io}`)"
      traefik.http.routers.listkit-demo-https.tls: true
      traefik.http.routers.listkit-demo-https.entrypoints: "https"
      traefik.http.routers.listkit-demo-https.tls.certresolver: "http"

